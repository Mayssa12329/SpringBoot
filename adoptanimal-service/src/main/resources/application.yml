server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ${SERVICE_NAME:adoptanimal-service}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://adoptanimal-db:5432/adoptanimal_db}
    username: ${SPRING_DATASOURCE_USERNAME:adoptanimal_user}
    password: ${SPRING_DATASOURCE_PASSWORD:adoptanimal_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true

# --- Services appelés (noms Docker Compose en conteneur, localhost en local) ---
# PETPASS_STUB / VETINTEROP_STUB = true -> client simulé ; false -> vrai appel.
# Par défaut : vrai PetPass (équipe, port 8082) et VetInterop simulé (service pas encore livré).
petpass:
  url: ${PETPASS_URL:http://petpass-service:8082}
  timeout-ms: 3000
  stub: ${PETPASS_STUB:false}
vetinterop:
  url: ${VETINTEROP_URL:http://vetinterop-service:8087/ws}
  timeout-ms: 3000
  stub: ${VETINTEROP_STUB:true}
notification:
  enabled: ${NOTIFICATION_ENABLED:false}
  url: ${NOTIFICATION_URL:http://notification-service:8086}
  timeout-ms: 2000

# --- Résilience (RM13 : timeout 3 s, 2 reprises, circuit breaker, repli) ---
resilience4j:
  retry:
    instances:
      vetinterop:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.medivet.adoptanimal.exception.RequeteSoapInvalideException
      petpass:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      vetinterop:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - com.medivet.adoptanimal.exception.RequeteSoapInvalideException
      petpass:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2

# --- Supervision ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
