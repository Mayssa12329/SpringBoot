server:
  port: 8080

spring:
  application:
    name: ${SERVICE_NAME:adoptanimal}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/adoptanimal}
    username: ${SPRING_DATASOURCE_USERNAME:medivet}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # le schéma est créé par Flyway
  flyway:
    enabled: true

# --- Services appelés (noms Docker Compose en conteneur, localhost en local) ---
petpass:
  url: ${PETPASS_URL:http://localhost:8082}
  timeout-ms: 3000
vetinterop:
  url: ${VETINTEROP_URL:http://localhost:8081/ws}
  timeout-ms: 3000
notification:
  enabled: ${NOTIFICATION_ENABLED:false}
  url: ${NOTIFICATION_URL:http://localhost:8086}
  timeout-ms: 2000

# --- Résilience (RM13 : timeout 3 s, 2 reprises, circuit breaker, repli) ---
resilience4j:
  retry:
    instances:
      vetinterop:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - tn.medivet.adoptanimal.exception.RequeteSoapInvalideException
      petpass:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      vetinterop:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - tn.medivet.adoptanimal.exception.RequeteSoapInvalideException
      petpass:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2

# --- Supervision ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
