server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: petpass-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://petpass-db:5432/petpass_db}
    username: ${SPRING_DATASOURCE_USERNAME:petpass_user}
    password: ${SPRING_DATASOURCE_PASSWORD:petpass_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "CREATE SCHEMA IF NOT EXISTS petpass_schema"
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: petpass_schema

jwt:
  secret: ${JWT_SECRET:MedivetSecretKey2024SuperLongueClePourLaSecuriteJWT!}
