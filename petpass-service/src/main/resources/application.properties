# ============================================================
# Microservice 2 : PetPass - Santé Animale (petpass-service)
# ============================================================
spring.application.name=petpass-service
server.port=8082

# PostgreSQL DataSource dédiée (Database per Service)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://petpass-db:5432/petpass_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:petpass_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:petpass_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
