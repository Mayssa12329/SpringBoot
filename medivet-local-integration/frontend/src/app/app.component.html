@if (showAppShell()) {
  <div class="app-shell">
    <app-sidebar
      [activeTab]="activeTab()"
      (tabChanged)="onSidebarTabChanged($event)"
    ></app-sidebar>
    <div class="app-main">
      <app-header></app-header>
      <main class="app-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else {
  <router-outlet></router-outlet>
}
