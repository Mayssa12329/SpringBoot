# ============================================================
# MEDIVET - Application Configuration (PetPass Backend)
# ============================================================

spring.application.name=MEDIVET
server.port=8081

# ============================================================
# PostgreSQL DataSource Configuration
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medivet_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:medivet_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:medivet_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# Hibernate / JPA Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=petpass_schema

# ============================================================
# Logging
# ============================================================
logging.level.com.medivet=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
