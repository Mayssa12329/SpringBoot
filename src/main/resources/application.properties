# Configuration de l'application
spring.application.name=MEDIVET
server.port=8080

# Configuration PostgreSQL / JPA
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medivet_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:medivet_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:medivet_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Actuator (T06) ───────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── SpringDoc / OpenAPI (T06) ────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── VetBookingService business configuration ─────────────────────────────────
# Interval (ms) for the waiting-list offer expiry scheduler (RM08)
vetbooking.waiting-list.expiry-check-ms=60000
