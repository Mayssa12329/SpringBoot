# Configuration de l'application
spring.application.name=MEDIVET
server.port=8080

# -------------------------------------------------------
# Base de données PostgreSQL
# -------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medivet_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:medivet_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:medivet_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------
# Hibernate / JPA
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------
# JWT - Authentification
# -------------------------------------------------------
jwt.secret=${JWT_SECRET:MedivetSecretKey2024SuperLongueClePourLaSecuriteJWT!}
jwt.expiration=${JWT_EXPIRATION:86400000}
