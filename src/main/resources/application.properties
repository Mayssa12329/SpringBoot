# ============================================================
# MEDIVET - Application Configuration (PetPass Backend)
# ============================================================

spring.application.name=petpass
server.port=8081

# ============================================================
# PostgreSQL DataSource Configuration
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medivet_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:medivet_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:medivet_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# SQL Initialization (creates petpass_schema)
spring.sql.init.mode=always

# ============================================================
# Hibernate / JPA Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=petpass_schema

# ============================================================
# Logging
# ============================================================
logging.level.com.medivet=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============================================================
# JWT - Authentification (Microservice Utilisateurs)
# ============================================================
jwt.secret=${JWT_SECRET:MedivetSecretKey2024SuperLongueClePourLaSecuriteJWT!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# HelpAnimal (E04) - Signalements d'animaux en detresse
# ============================================================
# Schema propre au service, gere par Flyway (scripts versionnes)
spring.flyway.enabled=true
spring.flyway.schemas=helpanimal_schema
spring.flyway.default-schema=helpanimal_schema
spring.flyway.locations=classpath:db/migration/helpanimal

# Photos des signalements (5 Mo max) : dossier distinct de uploads/ (servi en public)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
helpanimal.storage.directory=${HELPANIMAL_PHOTOS_DIR:helpanimal-photos}
helpanimal.photo.max-size-bytes=5242880

# RM02 : doublon = meme espece, moins de 100 m, moins de 2 h
helpanimal.duplicate.radius-meters=100
helpanimal.duplicate.window-minutes=120
# US22 : rayon des signalements proches (km)
helpanimal.nearby.default-radius-km=5
helpanimal.nearby.max-radius-km=50

# RM13 : appel gRPC vers RescueCoordinationService (timeout 3 s, 1 appel + 2 reprises)
rescue.grpc.host=${RESCUE_GRPC_HOST:localhost}
rescue.grpc.port=${RESCUE_GRPC_PORT:9090}
rescue.grpc.timeout-ms=3000
rescue.grpc.max-attempts=3
rescue.grpc.retry-wait-ms=200
# Stub local en attendant le vrai RescueCoordinationService (S5) : passer a false pour le brancher
rescue.stub.enabled=${RESCUE_STUB_ENABLED:true}
rescue.stub.port=${RESCUE_STUB_PORT:9090}

# Lien HelpAnimal -> PetPass (REST) a la fin d'un sauvetage
petpass.enabled=${PETPASS_ENABLED:true}
petpass.base-url=${PETPASS_SERVICE_URL:http://localhost:${server.port}}
