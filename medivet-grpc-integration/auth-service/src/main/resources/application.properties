# ============================================================
# Microservice 1 : Authentification & Utilisateurs (auth-service)
# ============================================================
spring.application.name=auth-service
server.port=8081

# PostgreSQL DataSource dédiée (Database per Service)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://auth-db:5432/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:auth_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:auth_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:MedivetSecretKey2024SuperLongueClePourLaSecuriteJWT!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# URLs inter-services REST
petpass.service.url=${PETPASS_SERVICE_URL:http://petpass-service:8082}
vetbooking.service.url=${VETBOOKING_SERVICE_URL:http://vetbooking-service:8083}
