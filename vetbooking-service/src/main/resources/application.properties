# ============================================================
# Microservice 3 : VetBooking - Rendez-vous (vetbooking-service)
# ============================================================
spring.application.name=vetbooking-service
server.port=8083

# PostgreSQL DataSource dédiée (Database per Service)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://vetbooking-db:5432/vetbooking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vetbooking_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vetbooking_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Inter-service URLs
petpass.service.url=${PETPASS_SERVICE_URL:http://petpass-service:8082}
auth.service.url=${AUTH_SERVICE_URL:http://auth-service:8081}
