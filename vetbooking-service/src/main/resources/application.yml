server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: vetbooking-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://vetbooking-db:5432/vetbooking_db}
    username: ${SPRING_DATASOURCE_USERNAME:vetbooking_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vetbooking_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

petpass:
  service:
    url: ${PETPASS_SERVICE_URL:http://petpass-service:8082}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:8081}

jwt:
  secret: ${JWT_SECRET:MedivetSecretKey2024SuperLongueClePourLaSecuriteJWT!}
