# Profil des tests HelpAnimal : base H2 en memoire (mode PostgreSQL), sans Docker.
spring:
  datasource:
    url: jdbc:h2:mem:medivet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

logging:
  level:
    com.medivet: INFO
    org.hibernate.SQL: WARN

helpanimal:
  storage:
    directory: target/test-photos
petpass:
  enabled: false
# Le canal vers RescueCoordination est remplace par un faux serveur en memoire (FakeRescueCoordination)
rescue:
  grpc:
    host: localhost
    port: 1
